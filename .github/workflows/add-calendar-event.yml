name: 自然言語からコピー用カレンダーへ予定を追加

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  add-event:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: 予定 JSON を生成して ICS カレンダーを更新
        shell: bash
        env:
          GEMINI_APIKEY: ${{ secrets.GEMINI_APIKEY }}
        run: |
          set -euo pipefail
          python scripts/add_ics_event.py \
            --source calendar/event-source.md \
            --json-output calendar/event-sources/latest.json \
            --output calendar/calender.ics

      - name: カレンダーをコミット
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add calendar/calender.ics calendar/event-sources/
          git diff --staged --quiet || git commit -m "Add calendar events"
          git push